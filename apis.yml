aid: mill
name: Mill
description: 'Mill is a consumer sustainability company that makes a smart kitchen bin which
  dries and grinds household food scraps overnight into dry, nutrient-rich "Food Grounds,"
  keeping food waste out of landfills and cutting the methane it would otherwise produce.
  Sold as a membership starting around $799 or roughly $66/month, the bin is odorless,
  reduces food-waste volume by about 80%, and the resulting grounds are reused in gardens,
  as chicken feed, or through farm partnerships. Mill also runs a commercial line for grocery,
  offices, food service, and municipalities. Backed by GV (Google Ventures), Mill is a
  consumer hardware and subscription business with a companion mobile app; it exposes no
  public developer API — its /api/ path is an internal app backend disallowed in robots.txt.'
